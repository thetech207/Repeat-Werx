[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repeatwerx"
version = "0.1.0"
description = "Seamless repeating pattern designer using constrained randomness"
readme = "README.md"
authors = [{name = "thetech207"}]
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt"]

[project.scripts]
repeatwerx = "repeatwerx.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
